name: Deploy to GitHub Pages

# main  -> https://otaku1123.github.io/md-browser/      (production)
# develop -> https://otaku1123.github.io/md-browser/dev/ (dev, not indexed)
# Pages hosts a single site, so every run builds both branches and publishes them together.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main
      - uses: actions/checkout@v7
        with:
          ref: develop
          path: develop
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            main/package-lock.json
            develop/package-lock.json
      - name: Build production (main)
        working-directory: main
        run: npm ci && npm run build
      - name: Build dev (develop)
        working-directory: develop
        env:
          VITE_DEPLOY_ENV: dev
        run: npm ci && npm run build
      - name: Assemble site
        run: |
          mkdir -p site/dev
          cp -R main/dist/. site/
          cp -R develop/dist/. site/dev/
          # Keep the dev site out of search results.
          for f in site/dev/*.html; do
            sed -i 's#<head>#<head>\n    <meta name="robots" content="noindex" />#' "$f"
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
