name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: Regenerate the screenshot baselines (tests/e2e/__screenshots__) and upload them as an artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: a new runner image can change fonts and so every screenshot baseline.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E tests (web app + extension)
        if: ${{ !inputs.update_screenshots }}
        run: npm run test:e2e
      - name: Update screenshot baselines
        if: ${{ inputs.update_screenshots }}
        run: npm run test:visual -- --update-snapshots
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.update_screenshots }}
        with:
          name: screenshots
          path: tests/e2e/__screenshots__/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
