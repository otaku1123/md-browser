name: Release

# Pushing a vX.Y.Z tag builds the extension zip and attaches it to a GitHub Release.
# Run it manually with an existing tag to (re)create the release for an older version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v1.6.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          # Full history so the tag can be checked against main.
          fetch-depth: 0
      - name: Check tag
        run: |
          version="${TAG#v}"
          for f in package.json extension/public/manifest.json; do
            v="$(node -p "require('./$f').version")"
            if [ "$v" != "$version" ]; then
              echo "::error::$f has version $v, but the tag is $TAG"; exit 1
            fi
          done
          # Store zips are built from main only (develop holds unreleased changes).
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main"; exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run pack:ext
      - name: Publish release
        run: |
          zip="release/md-browser-${TAG#v}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" --clobber
          else
            gh release create "$TAG" "$zip" --verify-tag --title "${TAG#v}" --generate-notes
          fi
