name: Release

# Pushing a vX.Y.Z tag builds the extension zip, attaches it to a GitHub Release, then uploads it
# to the Chrome Web Store and submits it for review (published automatically once approved).
# When the store listing text (docs/store/listing.md) changed since the previous release, the zip
# is only uploaded: the listing is updated by hand in the developer dashboard, then submitted there
# (or with this workflow and submit=only). Run it manually with an existing tag to (re)create the
# release for an older version; the store upload then only runs when asked for.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v1.6.0)
        required: true
      store:
        description: Also upload to the Chrome Web Store and submit for review
        type: boolean
        default: false
      submit:
        description: "Submit for review: auto = unless docs/store/listing.md changed since the previous release; no = upload only; only = submit the draft already uploaded"
        type: choice
        options: [auto, 'yes', 'no', only]
        default: auto

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          # Full history so the tag can be checked against main.
          fetch-depth: 0
      - name: Check tag
        run: |
          version="${TAG#v}"
          for f in package.json extension/public/manifest.json; do
            v="$(node -p "require('./$f').version")"
            if [ "$v" != "$version" ]; then
              echo "::error::$f has version $v, but the tag is $TAG"; exit 1
            fi
          done
          # Store zips are built from main only (develop holds unreleased changes).
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main"; exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run pack:ext
      - name: Publish release
        run: |
          zip="release/md-browser-${TAG#v}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" --clobber
          else
            gh release create "$TAG" "$zip" --verify-tag --title "${TAG#v}" --generate-notes
          fi

  # Keyless: GitHub's OIDC token is exchanged for the service account registered in the Chrome Web
  # Store dashboard (Workload Identity Federation). Skipped until the repository variables are set
  # (see docs/store/listing.md).
  store:
    needs: release
    if: vars.CWS_WIF_PROVIDER != '' && (github.event_name == 'push' || inputs.store)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          # Full history with tags: the listing is compared with the previous release.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Decide whether to submit for review
        id: decide
        env:
          MODE: ${{ inputs.submit || 'auto' }}
        run: |
          if [ "$MODE" = auto ]; then
            if [ "$(node scripts/store-text-changed.mjs "$TAG")" = true ]; then MODE=no; else MODE=yes; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "store: $MODE"
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - name: Upload and submit for review
        env:
          CWS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
          MODE: ${{ steps.decide.outputs.mode }}
        run: |
          gh release download "$TAG" -p '*.zip' -D release
          case "$MODE" in
            yes) flags="" ;;
            no) flags="--no-submit" ;;
            only) flags="--submit-only" ;;
            *) echo "::error::unknown submit mode $MODE"; exit 1 ;;
          esac
          node scripts/cws-publish.mjs "release/md-browser-${TAG#v}.zip" "${TAG#v}" $flags
          if [ "$MODE" = no ]; then
            msg="The store listing text changed in this release: the zip was uploaded but NOT submitted for review. Update the listing in the Chrome Web Store developer dashboard from docs/store/listing.md, then submit it there (or run this workflow with store=true and submit=only)."
            echo "::notice::$msg"
            printf '## Chrome Web Store\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
