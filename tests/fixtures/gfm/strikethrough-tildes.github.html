<div class="markdown-heading"><h1 class="heading-element">Strikethrough with one or three tildes</h1><a id="user-content-strikethrough-with-one-or-three-tildes" class="anchor" aria-label="Permalink: Strikethrough with one or three tildes" href="#strikethrough-with-one-or-three-tildes"><span aria-hidden="true" class="octicon octicon-link"></span></a></div>
<p><del>gone</del> with one tilde, and <del>two words</del> too.</p>
<p>Three ~~~tildes~~~ are not strikethrough.</p>
<p>Nested <del>a <del>b</del> c</del> and <del>a <del>b</del> c</del> work; ~~a~ b~~ mixes lengths and stays text.</p>
<p>One tilde pairs like emphasis does: <del>/home or a</del>b, but ~ spaced ~ and a lone ~/path stay text.</p>
